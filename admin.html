<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.supabase.co; frame-ancestors 'none'; base-uri 'none'; form-action 'none'">
<title>ERU Admin</title><link rel="icon" type="image/png" href="img/favicon.png"><link rel="stylesheet" href="css/style.css"></head><body>
<div class="loginwrap" id="loginView"><section class="login card"><div class="brand" style="margin-bottom:6px"><img class="logo" src="img/logo.png" alt="Emergency Response Unit logo"><div>ERU Admin Console<br><small>Authorized personnel only</small></div></div>
<form id="lf" autocomplete="off"><label for="u">Username</label><input id="u" maxlength="30" required><label for="p">Password</label><input id="p" type="password" maxlength="60" required>
<div style="margin-top:18px"><button class="btn big">Sign in</button></div></form><div id="lerr"></div><p><a href="index.html" class="mut">← Back to public report page</a></p></section></div>
<div id="app" class="shell hide">
<aside class="side"><div class="brand"><img class="logo" src="img/logo.png" alt="Emergency Response Unit logo"><div>ERU Admin<br><small>Command &amp; Dispatch</small></div></div><div class="cap">Navigation</div>
<button class="tab on" data-t="reqs" data-title="Incident Requests">📨 Requests</button><button class="tab" data-t="resp" data-title="Responder Availability">🚒 Responders</button>
<button class="tab" data-t="month" data-title="Monthly Report">📅 Monthly Report</button><button class="tab" data-t="year" data-title="Yearly Scale">📊 Yearly Scale</button>
<div class="me"><small>Signed in as <b>Administrator</b></small><button class="btn red sm" id="out">Logout</button></div></aside>
<div><div class="top"><h1 id="pageTitle">Incident Requests</h1><span class="badge" id="clock"></span></div>
<main><section id="reqs" class="sec"></section><section id="resp" class="sec hide"></section><section id="month" class="sec hide"></section><section id="year" class="sec hide"></section></main></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- shared -->
<script src="js/shared/config.js"></script>
<script src="js/shared/store.js"></script>
<!-- admin page (shell.js must stay last) -->
<script src="js/admin/auth.js"></script>
<script src="js/admin/helpers.js"></script>
<script src="js/admin/requests.js"></script>
<script src="js/admin/responders.js"></script>
<script src="js/admin/reports.js"></script>
<script src="js/admin/shell.js"></script>
</body></html>
